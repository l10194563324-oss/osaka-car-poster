<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>大阪租车 · 超清海报工厂</title>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>

<style>

body{
    margin:0;
    padding:20px 0;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* 控制区 */

.controls{
    width:360px;
    background:#fff;
    padding:15px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.06);
    margin-bottom:20px;
    box-sizing:border-box;
}

select{
    width:100%;
    height:46px;
    border-radius:10px;
    border:1px solid #ddd;
    padding:0 12px;
    font-size:15px;
    margin-bottom:12px;
    outline:none;
}

.btn-row{
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    height:46px;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.btn-up{
    background:#eee;
}

.btn-dl{
    background:#000;
    color:#fff;
}

/* 预览缩放 */

.preview-wrap{
    width:375px;
    overflow:hidden;
}

/* 真正高清海报 */

#poster-wrap{
    width:1242px;
    height:1660px;
    background:#fff;
    overflow:hidden;

    transform:scale(0.3017);
    transform-origin:top left;

    margin-bottom:-1158px;
}

/* 图片区 */

#photo-grid{
    width:1242px;
    height:996px;
    display:grid;
    gap:4px;
    background:#fff;
}

.photo-cell{
    overflow:hidden;
    position:relative;
    background:#eee;
}

.photo-cell img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* 文字区 */

.text-section{
    width:1242px;
    height:664px;
    box-sizing:border-box;
    padding:60px 72px;
    display:flex;
    flex-direction:column;
    border-top:2px solid #eee;
}

.car-title{
    font-size:72px;
    font-weight:900;
    line-height:1.1;
    border-bottom:8px solid #000;
    width:fit-content;
    margin-bottom:40px;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:36px;
}

.info-item b{
    display:block;
    font-size:24px;
    color:#999;
    margin-bottom:10px;
    letter-spacing:1px;
}

.info-item span{
    display:block;
    font-size:32px;
    line-height:1.7;
    color:#222;
    font-weight:600;
}

.footer{
    margin-top:auto;
    border-top:2px solid #f2f2f2;
    padding-top:20px;
    display:flex;
    justify-content:space-between;
    font-size:20px;
    color:#bbb;
    font-weight:700;
}

/* 下载弹窗 */

#download-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    display:none;
    z-index:999;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#result-img{
    width:90%;
    max-height:85%;
    object-fit:contain;
    border-radius:12px;
}

.overlay-tip{
    color:#fff;
    margin-top:16px;
    font-size:15px;
    font-weight:700;
}

.close-btn{
    position:absolute;
    top:20px;
    right:24px;
    color:#fff;
    font-size:38px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="controls">

    <select id="carSelect" onchange="updateUI()">
        <option value="">-- 选择车型 --</option>
    </select>

    <div class="btn-row">
        <button class="btn btn-up" onclick="fileIn.click()">上传照片</button>
        <button class="btn btn-dl" onclick="processPoster()">生成高清海报</button>
    </div>

    <input type="file" id="fileIn" multiple accept="image/*" style="display:none" onchange="loadPhotos(this)">

</div>

<div class="preview-wrap">

<div id="poster-wrap">

    <div id="photo-grid"></div>

    <div class="text-section">

        <div class="car-title" id="outTitle">MODEL</div>

        <div class="info-grid">

            <div class="info-item">
                <b>载人数量 / GUESTS</b>
                <span id="outP">-</span>
            </div>

            <div class="info-item">
                <b>性能特点 / FEATURES</b>
                <span id="outL">-</span>
            </div>

            <div class="info-item">
                <b>行李装载能力 / CARGO</b>
                <span id="outC">-</span>
            </div>

            <div class="info-item">
                <b>备注说明 / REMARK</b>
                <span id="outD">-</span>
            </div>

        </div>

        <div class="footer">
            <span>PREMIUM RENTAL OSAKA</span>
            <span>KANSAI DRIVE 2026</span>
        </div>

    </div>

</div>

</div>

<div id="download-overlay">

    <div class="close-btn" onclick="closeOverlay()">×</div>

    <img id="result-img">

    <div class="overlay-tip">
        长按图片保存
    </div>

</div>

<script>

const carData = [

    {
        id:"TOYOTA SIENNA",
        p:"7人",
        l:"2.5L 混动，双侧滑门，超大空间",
        c:"28寸×5 + 20寸×2",
        d:"满载依然拥有优秀装载能力"
    },

    {
        id:"ALPHARD 40系",
        p:"6人",
        l:"TNGA-K 平台，极致静谧",
        c:"28寸×4",
        d:"高端商务及家庭出行"
    },

    {
        id:"NISSAN NOTE",
        p:"2-3人",
        l:"e-POWER 电驱技术",
        c:"24寸×2",
        d:"市区驾驶非常轻松"
    }

];

const sel = document.getElementById('carSelect');

carData.forEach((item,index)=>{

    const opt = document.createElement('option');

    opt.value = index;

    opt.innerText = item.id;

    sel.appendChild(opt);

});

function updateUI(){

    const d = carData[sel.value];

    if(!d) return;

    outTitle.innerText = d.id;
    outP.innerText = d.p;
    outL.innerText = d.l;
    outC.innerText = d.c;
    outD.innerText = d.d;

}

function loadPhotos(input){

    const files = Array.from(input.files);

    const grid = document.getElementById('photo-grid');

    grid.innerHTML = '';

    const count = Math.min(files.length,3);

    if(count === 1){

        grid.style.gridTemplateColumns = '1fr';

    }else if(count === 2){

        grid.style.gridTemplateColumns = '1fr 1fr';

    }else{

        grid.style.gridTemplateColumns = '1.5fr 1fr';

    }

    files.slice(0,3).forEach((file,i)=>{

        const reader = new FileReader();

        reader.onload = function(e){

            const cell = document.createElement('div');

            cell.className = 'photo-cell';

            if(count >=3 && i===0){

                cell.style.gridRow = 'span 2';

            }

            const img = document.createElement('img');

            img.src = e.target.result;

            img.decoding = "sync";

            img.loading = "eager";

            cell.appendChild(img);

            grid.appendChild(cell);

        }

        reader.readAsDataURL(file);

    });

}

function processPoster(){

    if(!sel.value){

        alert('请先选择车型');

        return;

    }

    htmlToImage.toPng(

        document.getElementById('poster-wrap'),

        {
            pixelRatio:1,
            cacheBust:true,
            backgroundColor:'#ffffff'
        }

    ).then(function(dataUrl){

        document.getElementById('result-img').src = dataUrl;

        document.getElementById('download-overlay').style.display = 'flex';

    });

}

function closeOverlay(){

    document.getElementById('download-overlay').style.display = 'none';

}

</script>

</body>
</html>
