<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大阪租车 · 3:4 海报工坊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --bg: #FFFFFF; --ink: #1A1A1A; }
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #F0F0F0; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .panel { background: white; padding: 15px; width: 100%; max-width: 375px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; box-sizing: border-box; }
        input, textarea, button { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #DDD; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        textarea { height: 60px; resize: none; }
        button { background: #000; color: #FFF; font-weight: bold; border: none; cursor: pointer; }
        .hint { font-size: 10px; color: #999; text-align: center; margin-bottom: 10px; }

        /* 3:4 比例画布锁定 */
        #poster { 
            width: 375px; height: 500px; 
            background: var(--bg); display: flex; flex-direction: column; 
            overflow: hidden; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        #photo-grid { height: 60%; display: grid; gap: 2px; background: #FFF; }
        .grid-img { width: 100%; height: 100%; object-fit: cover; }
        .text-section { height: 40%; padding: 15px 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .car-name { font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 900; border-bottom: 2px solid #000; margin-bottom: 10px; width: fit-content; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .info-item b { font-size: 9px; color: #AAA; display: block; margin-bottom: 2px; text-transform: uppercase; }
        .info-item span { font-size: 11px; line-height: 1.4; color: #333; }
        .footer { margin-top: auto; border-top: 1px solid #EEE; padding-top: 5px; font-size: 8px; color: #CCC; display: flex; justify-content: space-between; font-weight: bold; }
    </style>
</head>
<body>

    <div class="panel">
        <input type="text" id="inName" placeholder="车型 (如: 丰田埃尔法 40系)">
        <input type="text" id="inPeople" placeholder="建议人数 (如: 4-6人)">
        <input type="text" id="inCargo" placeholder="行李建议 (如: 28寸x4 或 20寸x6)">
        <textarea id="inLayout" placeholder="空间体验描述..."></textarea>
        <textarea id="inDrive" placeholder="驾驶性能评价..."></textarea>
        <div class="hint">多选上传：建议上传 3 张照片 (外观/座舱/行李箱)</div>
        <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this)">
        <button onclick="render()">1. 实时排版预览</button>
        <button onclick="download()" style="background:#2D5A27; margin-top:5px;">2. 保存 3:4 高清海报</button>
    </div>

    <div id="poster">
        <div id="photo-grid"></div>
        <div class="text-section">
            <div class="car-name" id="outName">车型预览</div>
            <div class="info-grid">
                <div class="info-item"><b>建议人数 / GUESTS</b><span id="outPeople">...</span></div>
                <div class="info-item"><b>行李建议 / CARGO</b><span id="outCargo">...</span></div>
                <div class="info-item"><b>空间体验 / LAYOUT</b><span id="outLayout">...</span></div>
                <div class="info-item"><b>自驾评价 / DRIVE</b><span id="outDrive">...</span></div>
            </div>
            <div class="footer"><span>OSAKA PREMIUM RENTAL</span><span>KANSAI DRIVE 2026</span></div>
        </div>
    </div>

    <script>
        let files = [];
        function handleFiles(i) { files = Array.from(i.files); }
        function render() {
            const g = document.getElementById('photo-grid'); g.innerHTML = '';
            const cnt = files.length;
            if(cnt === 1) g.style.gridTemplateColumns = '1fr';
            else if(cnt === 2) g.style.gridTemplateColumns = '1fr 1fr';
            else g.style.gridTemplateColumns = '1.5fr 1fr';
            
            files.slice(0, 3).forEach((f, idx) => {
                const r = new FileReader();
                r.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result; img.className = 'grid-img';
                    if(cnt >= 3 && idx === 0) img.style.gridRow = 'span 2';
                    g.appendChild(img);
                };
                r.readAsDataURL(f);
            });
            document.getElementById('outName').innerText = document.getElementById('inName').value || "未命名车型";
            document.getElementById('outPeople').innerText = document.getElementById('inPeople').value || "待输入";
            document.getElementById('outCargo').innerText = document.getElementById('inCargo').value || "待输入";
            document.getElementById('outLayout').innerText = document.getElementById('inLayout').value || "待输入";
            document.getElementById('outDrive').innerText = document.getElementById('inDrive').value || "待输入";
        }
        function download() {
            html2canvas(document.getElementById('poster'), { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `大阪租车-${document.getElementById('outName').innerText}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
