<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大阪租车海报生成器</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { font-family: -apple-system, "Helvetica Neue", sans-serif; background: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        /* 操控面板 */
        .config-panel { width: 100%; max-width: 400px; background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; box-sizing: border-box; }
        .config-label { font-size: 13px; color: #666; margin-bottom: 8px; font-weight: bold; display: block; }
        select { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; margin-bottom: 15px; background: #fff; }
        .button-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 14px; border-radius: 10px; font-weight: bold; border: none; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .btn-upload { background: #f8f9fa; color: #333; border: 1px dashed #adb5bd; }
        .btn-generate { background: #000; color: #fff; }

        /* 海报预览核心容器 - 严格 3:4 */
        #poster-canvas { width: 375px; height: 500px; background: #fff; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* 图片区域 - 锁定 60% 高度 */
        .photo-area { width: 100%; height: 60%; background: #eee; display: grid; gap: 2px; overflow: hidden; pointer-events: none; }
        .grid-img { width: 100%; height: 100%; object-fit: cover; }

        /* 文字区域 - 锁定 40% 高度 - 绝对不被遮挡 */
        .info-area { width: 100%; height: 40%; background: #fff; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; z-index: 99; border-top: 1px solid #eee; }
        .car-name { font-size: 22px; font-weight: 900; border-bottom: 3.5px solid #000; margin-bottom: 15px; width: fit-content; text-transform: uppercase; line-height: 1.1; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .data-item b { font-size: 10px; color: #999; display: block; margin-bottom: 2px; letter-spacing: 0.5px; }
        .data-item span { font-size: 11px; line-height: 1.4; color: #333; font-weight: 600; display: block; }
        .footer-bar { margin-top: auto; border-top: 1px solid #f0f0f0; padding-top: 8px; font-size: 8.5px; color: #ccc; display: flex; justify-content: space-between; font-weight: bold; }

        /* 生成结果显示（用于手机长按下载） */
        #output-overlay { display: none; margin-top: 20px; width: 100%; max-width: 375px; text-align: center; }
        #output-img { width: 100%; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); border: 4px solid white; }
        .save-hint { color: #ff4757; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="config-panel">
        <label class="config-label">1. 选择车型 (严格对齐表格)</label>
        <select id="vehicleSelector" onchange="applyVehicleData()">
            <option value="">-- 请点击此处选择车型 --</option>
        </select>

        <div class="button-group">
            <div class="btn btn-upload" onclick="document.getElementById('inputFiles').click()">📸 上传照片</div>
            <div class="btn btn-generate" onclick="renderPoster()">✨ 生成海报</div>
        </div>
        <input type="file" id="inputFiles" multiple accept="image/*" style="display:none" onchange="renderPhotos(this)">
    </div>

    <div id="poster-canvas">
        <div class="photo-area" id="photoGrid"></div>
        <div class="info-area">
            <div class="car-name" id="labelTitle">MODEL</div>
            <div class="data-grid">
                <div class="data-item"><b>载人数量 / GUESTS</b><span id="labelP">-</span></div>
                <div class="data-item"><b>动力与性能特点 / POWER</b><span id="labelL">-</span></div>
                <div class="data-item"><b>行李装载能力 / CARGO</b><span id="labelC">-</span></div>
                <div class="data-item"><b>备注 / REMARK</b><span id="labelD">-</span></div>
            </div>
            <div class="footer-bar"><span>PREMIUM RENTAL OSAKA</span><span>KANSAI DRIVE 2026</span></div>
        </div>
    </div>

    <div id="output-overlay">
        <div class="save-hint">海报已生成！请长按图片保存到手机</div>
        <img id="output-img" src="" alt="请长按保存">
    </div>

    <script>
        // 严格按照您的 CSV 数据录入
        const carSource = [
            {id:"SUBARU IMPREZA", p:"2-4人", l:"2.0L 水平对置引擎，全时四驱，抓地力极强。", c:"28寸×1 + 24寸×1", d:"适合追求驾驶稳定性的用户，雨雪天气表现优秀。"},
            {id:"HONDA FIT", p:"2-3人", l:"1.5L 动力，空间魔术师，视野好，市区穿梭灵活。", c:"24寸×2 + 20寸×2", d:"同级别空间利用率最高，后排座椅可向上折叠。"},
            {id:"TOYOTA AQUA", p:"2人", l:"1.5L 混动，极其省油，转向半径小，好停车。", c:"24寸×2 或 20寸×3", d:"适合 2 人深度游，后排坐人后行李空间较局促。"},
            {id:"TOYOTA YARIS", p:"2人", l:"1.5L 动力，TNGA 架构，操控灵活，安全配置高。", c:"24寸×1 + 20寸×2", d:"适合 1-2 人轻便出行，油耗表现极佳。"},
            {id:"NISSAN NOTE", p:"2-3人", l:"e-POWER 电驱技术，加速平顺，行驶静谧。", c:"24寸×2 + 20寸×1", d:"内部空间略优于 Yaris，电机驱动动力响应快。"},
            {id:"TOYOTA GR YARIS", p:"1-2人", l:"1.6T 四驱，WRC 拉力赛基因，钢炮级性能。", c:"20寸×2", d:"纯性能车，后备箱极小，不建议带大件行李。"},
            {id:"ALPHARD 3代 黄金版", p:"6-7人", l:"2.5L/3.5L，豪华航空座椅，侧滑门，滤震极佳。", c:"28寸×4 或 20寸×8", d:"5 人状态下行李空间最充裕；坐满 7 人则空间极小。"},
            {id:"ALPHARD 3代 SC版", p:"6-7人", l:"配置略高于黄金版，内饰更具质感，极致舒适。", c:"28寸×4 或 20寸×8", d:"大阪/京都接送机及长途包车的明星车型。"},
            {id:"ALPHARD 40系", p:"6人", l:"全新 TNGA-K 平台，更静谧，二排触控屏调节。", c:"28寸×4 或 20寸×6", d:"目前租车市场的旗舰王牌，档次感最高。"},
            {id:"VELLFIRE 40系", p:"6人", l:"运动化调教，外观更霸气，动力响应更积极。", c:"28寸×4 或 20寸×6", d:"适合追求个性与动力的高端商务/家庭用户。"},
            {id:"TOYOTA SIENNA", p:"7人", l:"2.5L 混动，双侧滑门，超大纵向空间。", c:"28寸×5 + 20寸×2", d:"7 人满载时仍有极强的行李装载能力，性价比之王。"},
            {id:"LEXUS LM", p:"4人", l:"顶级 4 座布局，车载冰箱，电视屏，极致私密。", c:"28寸×4", d:"专为极致商务需求设计，大阪市内顶奢接送。"},
            {id:"LEXUS RX", p:"4-5人", l:"豪华 SUV 标杆，油电混动，内饰做工极细腻。", c:"28寸×2 + 20寸×2", d:"适合关西郊外自驾，驾驶视野好，品牌认可度高。"},
            {id:"BMW 5 SERIES TOURING", p:"4-5人", l:"旅行车身，操控精准，高速巡航质感极佳。", c:"28寸×2 + 24寸×2", d:"后备箱开口大，适合追求品味与驾驶感的旅行者。"},
            {id:"BENZ C-CLASS ESTATE", p:"2-4人", l:"优雅旅行版，精致内饰，转向轻盈，好开好停。", c:"28寸×2", d:"适合 2-3 人携带少量大件行李，市区游玩非常方便。"},
            {id:"TOYOTA HIACE 9座", p:"9人", l:"2.8T 柴油，超强扭矩，最强空间利用率。", c:"28寸×8", d:"大团队、滑雪团、高尔夫团的唯一选择。"},
            {id:"TOYOTA NOAH", p:"6-7人", l:"混动系统，低地台设计，上下车方便。", c:"28寸×3", d:"实用型 MPV，空间灵活，适合普通家庭日本自由行。"},
            {id:"TOYOTA VOXY", p:"6-7人", l:"与 Noah 同平台，外观更犀利，LED 大灯组。", c:"28寸×3", d:"适合带小朋友的家庭，视野好且侧滑门安全方便。"},
            {id:"BENZ V-CLASS", p:"6-7人", l:"德系商务风，空间方正，品牌气场强大。", c:"28寸×5", d:"行李空间表现优于埃尔法，适合高端商务组团。"},
            {id:"BMW X5", p:"4-5人", l:"3.0T 动力，公路王者，四驱系统应对复杂路况。", c:"28寸×3", d:"空间宽敞，适合长途跨城及山路驾驶。"}
        ];

        const selector = document.getElementById('vehicleSelector');
        carSource.forEach((car, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = car.id;
            selector.appendChild(opt);
        });

        function applyVehicleData() {
            const car = carSource[selector.value];
            if (!car) return;
            document.getElementById('labelTitle').innerText = car.id;
            document.getElementById('labelP').innerText = car.p;
            document.getElementById('labelL').innerText = car.l;
            document.getElementById('labelC').innerText = car.c;
            document.getElementById('labelD').innerText = car.d;
        }

        function renderPhotos(input) {
            const files = Array.from(input.files);
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';
            const count = files.length;
            
            // 响应式拼图样式
            grid.style.gridTemplateColumns = count >= 3 ? '1.6fr 1fr' : (count === 2 ? '1fr 1fr' : '1fr');
            
            files.slice(0, 3).forEach((file, i) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'grid-img';
                    if(count >= 3 && i === 0) img.style.gridRow = 'span 2';
                    grid.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        function renderPoster() {
            if(!selector.value) { alert("请先选择车型！"); return; }
            const overlay = document.getElementById('output-overlay');
            const outImg = document.getElementById('output-img');
            
            // 使用 html2canvas 将预览区转为图片
            html2canvas(document.getElementById('poster-canvas'), {
                scale: 3, // 高清导出
                useCORS: true,
                logging: false,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                outImg.src = canvas.toDataURL("image/png");
                overlay.style.display = "block";
                // 自动平滑滚动到生成的图片位置
                overlay.scrollIntoView({ behavior: 'smooth' });
            });
        }
    </script>
</body>
</html>
